name: Verificación

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: sh probar.sh
